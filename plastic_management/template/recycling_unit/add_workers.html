
{% extends 'recycling_unit/header_footer.html' %}
    
{% block content %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0 text-dark">Add Workers....</h1>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="/recyclingunit_home/"><a href="#">Home</a></li>
              
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <!-- Small boxes (Stat box) -->
        
<section class="content">
    <h1>{{error}}</h1>
      <form role="form"action="/add_workers/" method="POST" >
  {% csrf_token %}
                <div class="card-body">
                  <div class="form-group">
                    <label for="exampleInputEmail1">Name:</label>
                    <input type="text" name="name" class="form-control" id="exampleInputEmail1" placeholder="Enter  name" required="">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">Address:</label>
                    <input type="text" name="address" class="form-control" id="exampleInputPassword1" placeholder="Address " required="">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">Place:</label>
                    <input type="text" name="place" class="form-control" id="exampleInputPassword1" placeholder="Place" required="">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">DOB:</label>
                    <input type="date" name="dob" class="form-control" id="exampleInputPassword1" placeholder="Stock number" required="">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">Email:</label>
                    <input type="email" name="email" class="form-control" id="exampleInputPassword1" placeholder="Email" required="">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">Password:</label>
                    <input type="password" name="psw" class="form-control" id="exampleInputPassword1" placeholder="password" required="">
                  </div>
                 <div class="form-group">
                    <label for="exampleInputPassword1">Phone number:</label>
                    <input type="text" name="pno" class="form-control" id="exampleInputPassword1" placeholder="Phone number" required="" maxlength="10">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">Aadhar number:</label>
                    <input type="text" name="adr" class="form-control" id="exampleInputPassword1" placeholder="Aadhar number" required="" maxlength="12">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">Department:</label>
                    <select name="wtype" class="form-control">
                            <option disabled selected>Select Department </option>
                
                            <option value="collecting dept">Collecting Department</option>
                             <option value="delivery dept">Delivery Department</option>
                            
                            </select>
                  </div>
                  <div class="form-check">
                    <!-- <input type="checkbox" class="form-check-input" id="exampleCheck1"> -->
                    <!-- <label class="form-check-label" for="exampleCheck1">Check me out</label> -->
                  </div>
                </div>
                <!-- /.card-body -->

                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            </div>
      <!-- /.row -->
    </section>

        
        <!-- /.row (main row) -->
      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
  {% endblock %}
